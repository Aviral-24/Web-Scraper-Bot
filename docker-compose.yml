services:
  mysql_db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: scraper_db
      MYSQL_USER: scraper
      MYSQL_PASSWORD: ${DB_PASS:-scraper_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-scraper_root_dev_password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_HOST: mysql_db
      DB_PORT: "3306"
      DB_USER: scraper
      DB_PASS: ${DB_PASS:-scraper_dev_password}
      DB_NAME: scraper_db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
